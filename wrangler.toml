# wrangler.toml — Worker bixos avec assets statiques et API Hono

name = "bixos"
main = "server.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

# Build : prisma generate + Vite frontend
# Wrangler bundle server.ts automatiquement
[build]
command = "npx prisma generate && vite build"

# Résolution du client Prisma généré localement
[alias]
".prisma/client/default" = "./src/generated/prisma/default"

# Assets statiques (build Vite → dist/)
[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bixos-db"
database_id = "94ddc43c-96d8-419d-8ecd-bd28f5e461a1"
